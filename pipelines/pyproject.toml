[project]
name = "alphastock-pipelines"
version = "0.1.0"
description = "AlphaStock signal pipelines: ingestion, scoring, attestation"
requires-python = ">=3.11"
dependencies = [
    "gridstatus>=0.37",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipelines"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
