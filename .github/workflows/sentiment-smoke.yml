name: Sentiment live smoke

# Manual one-off scan over 2 topics — never runs on PRs or pushes.
# CI stays offline; this workflow is the blueprint's live-smoke acceptance step.
# platforms=reddit runs the native Reddit path; x-indexed / linkedin-indexed
# run through the treg.to gateway and need TREG_TOKEN.
on:
  workflow_dispatch:
    inputs:
      topics:
        description: "Comma-separated topic ids (default: dc-capex,cooling-tech)"
        default: "dc-capex,cooling-tech"
      platforms:
        description: "Comma-separated platforms (reddit,x-indexed,linkedin-indexed; default: reddit)"
        default: "reddit"

jobs:
  smoke:
    name: Live scan over 2 topics
    runs-on: ubuntu-latest
    # Reddit search requires application-only OAuth (anonymous requests get
    # HTTP 403 from GitHub runners). OWNER ACTION REQUIRED: create a Reddit
    # app at https://www.reddit.com/prefs/apps (type "web app"), then add
    # REDDIT_CLIENT_ID and REDDIT_CLIENT_SECRET as repository secrets
    # (Settings → Secrets and variables → Actions). Without them the scan
    # fails loudly with setup instructions.
    # X/LinkedIn runs need TREG_TOKEN (treg.to gateway); TREG_MAX_COST is an
    # optional spend cap forwarded as X-Treg-Route-Max-Cost. A missing
    # TREG_TOKEN fails loudly with setup instructions.
    env:
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      TREG_TOKEN: ${{ secrets.TREG_TOKEN }}
      TREG_MAX_COST: ${{ secrets.TREG_MAX_COST }}
    defaults:
      run:
        working-directory: pipelines
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipelines/pyproject.toml
      - run: pip install -e ".[dev]"
      # Reddit's API rate limits still apply under OAuth; treg-backed platforms
      # are paced by the scan. The built-in pacing keeps request volume low.
      - run: python -m pipelines.sentiment.run_scan --platforms "${{ github.event.inputs.platforms }}" --topics "${{ github.event.inputs.topics }}"
      - name: Report per-platform kept counts
        run: |
          python - <<'PY'
          import json

          payload = json.load(open("data/sentiment/latest.json"))
          coverage = payload.get("coverage", {})
          if not coverage:
              print("no coverage block in run payload")
          for platform, entry in coverage.items():
              kept = entry["kept"]
              target = entry["keep_target"]
              ladder = ",".join(entry["ladder_steps"])
              window = entry["effective_window_days"]
              verdict = "OK" if kept >= target else "SHORTFALL (reported honestly)"
              print(
                  f"{platform}: fetched={entry['fetched']} deduped={entry['deduped']} "
                  f"kept={kept}/{target} window={window}d ladder=[{ladder}] {verdict}"
              )
          PY
      - name: Upload staged run
        uses: actions/upload-artifact@v4
        with:
          name: sentiment-smoke-run
          path: |
            pipelines/data/sentiment/runs/scan-*.json
            pipelines/data/sentiment/latest.json
