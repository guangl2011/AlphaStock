# Weekly scan + aggregate report (build spec: "Weekly scanning and reporting
# automation").
#
# - Monday 06:00 UTC: live scan across all 7 ISO queues + the EDGAR FTS leg,
#   behind the source-health gate — a stale or failed source fails the run
#   (red workflow), never a silent zero-signal week.
# - The rotated queue snapshot and the rendered report (markdown page +
#   queryable JSON for the Explorer /weekly route) are committed back to main.
# - workflow_dispatch inputs exist so the pipeline can be demonstrated
#   deterministically in fixtures mode (no network, pinned as_of) without
#   configured secrets. Scheduled runs stay live.
#
# The county-permitting leg has no live collector yet (PR #5 ships the
# watchlist + ingest; collection is operator-supplied JSON). Scheduled runs
# cover queues + EDGAR until a live collector lands — the skip is a plan
# decision recorded here, not a silent source failure.

name: weekly-scan

on:
  schedule:
    - cron: "0 6 * * 1" # Monday 06:00 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: "Scan mode: live sources or committed fixtures (deterministic demo)"
        type: choice
        options: [live, fixtures]
        default: live
      as_of:
        description: "Optional scan/report instant (ISO-8601 with offset) — pins fixtures mode"
        type: string
        default: ""
      publish:
        description: "Publish signals + source health to the store (needs SUPABASE_DB_URL)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: weekly-scan
  cancel-in-progress: false

jobs:
  scan-and-report:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipelines
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipelines/pyproject.toml

      - name: Install pipelines package
        run: pip install -e ".[dev]"

      - name: Run weekly scan (source-health gate is fatal)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SCAN_MODE: ${{ inputs.mode || 'live' }}
          AS_OF: ${{ inputs.as_of }}
          PUBLISH: ${{ inputs.publish == false && 'false' || 'true' }}
        run: |
          AS_OF_ARGS=""
          if [ -n "$AS_OF" ]; then
            AS_OF_ARGS="--as-of $AS_OF"
          fi
          PUBLISH_ARGS=""
          if [ "$SCAN_MODE" = "live" ] && [ "$PUBLISH" = "true" ]; then
            PUBLISH_ARGS="--publish"
          fi
          mkdir -p /tmp/weekly
          python -m pipelines.scan \
            --mode "$SCAN_MODE" \
            --all-isos \
            --edgar \
            $AS_OF_ARGS \
            $PUBLISH_ARGS \
            --snapshot data/snapshots/queue_snapshot.json \
            --snapshot-out data/snapshots/queue_snapshot.json \
            --signals-out /tmp/weekly/signals.json \
            --health-out /tmp/weekly/health.json

      - name: Build weekly report
        env:
          AS_OF: ${{ inputs.as_of }}
        run: |
          AS_OF_ARGS=""
          if [ -n "$AS_OF" ]; then
            AS_OF_ARGS="--as-of $AS_OF"
          fi
          # Optional operator-maintained inputs: an earnings calendar for the
          # lag tracker and audited ground-truth URLs for the V4 pilot.
          EXTRA_ARGS=""
          if [ -f data/earnings_calendar.csv ]; then
            EXTRA_ARGS="$EXTRA_ARGS --earnings data/earnings_calendar.csv"
          fi
          if [ -f data/v4_audit_ground_truth.json ]; then
            EXTRA_ARGS="$EXTRA_ARGS --pilot-ground-truth data/v4_audit_ground_truth.json"
          fi
          python -m pipelines.report.weekly \
            --signals /tmp/weekly/signals.json \
            --health /tmp/weekly/health.json \
            $AS_OF_ARGS \
            $EXTRA_ARGS \
            --out ../web/public/weekly

      - name: Commit rotated snapshot + report to main
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pipelines/data/snapshots/queue_snapshot.json web/public/weekly/
          if git diff --cached --quiet; then
            echo "Nothing to commit — report unchanged."
          else
            git commit -m "chore(weekly): scan + report for $(date -u +%F)"
            git push
          fi

      - name: Upload report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-report
          path: |
            web/public/weekly/
            pipelines/data/snapshots/queue_snapshot.json
          if-no-files-found: warn
